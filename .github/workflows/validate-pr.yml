name: Validate Android pull request
on:
  pull_request:
    branches: [main, experimental/incall-unified-detection]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify shell-side answered-call state machine
        run: |
          mkdir -p "$RUNNER_TEMP/vrec-shell-regression"
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/AnsweredCallGate.java \
            shellserver/tests/AnsweredCallGateTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.AnsweredCallGateTest
      - name: Compile and test without publishing
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          else
            gradle --no-daemon testDebugUnitTest assembleDebug
          fi
