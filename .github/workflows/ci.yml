name: Android CI

on:
  pull_request:
    branches: [ main, experimental/incall-unified-detection ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify shell-side answered-call state machine
        run: |
          mkdir -p "$RUNNER_TEMP/vrec-shell-regression"
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/AnsweredCallGate.java \
            shellserver/tests/AnsweredCallGateTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.AnsweredCallGateTest
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/CallStates.java \
            shellserver/tests/CallStatesTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.CallStatesTest
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/PcmChannelHealth.java \
            shellserver/tests/PcmChannelHealthTest.java \
            shellserver/src/com/genymobile/scrcpy/audio/AudioReadGuard.java \
            shellserver/tests/AudioReadGuardTest.java
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/VoipMicHealth.java \
            shellserver/tests/VoipMicHealthTest.java \
            shellserver/src/com/vrec/app/shell/PcmRing.java \
            shellserver/tests/PcmRingTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.VoipMicHealthTest
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.PcmRingTest
          javac -cp "$RUNNER_TEMP/vrec-shell-regression" -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/CaptureHealthFile.java \
            shellserver/tests/CaptureHealthFileTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.CaptureHealthFileTest
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.PcmChannelHealthTest
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.genymobile.scrcpy.audio.AudioReadGuardTest
          javac -d "$RUNNER_TEMP/vrec-shell-regression" \
            shellserver/src/com/vrec/app/shell/MultiSimCalls.java \
            shellserver/tests/MultiSimCallsTest.java \
            shellserver/src/com/vrec/app/shell/CallSignals.java \
            shellserver/tests/CallSignalsTest.java
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.MultiSimCallsTest
          java -cp "$RUNNER_TEMP/vrec-shell-regression" com.vrec.app.shell.CallSignalsTest

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PappVersion=0.1
