name: Build VREC APK

on:
  push:
    branches: [main-shizuku]
    # Documentation-only pushes don't change the APK, so they don't publish a release.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main-shizuku]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

# Serialize releases so two quick pushes cannot choose the same version.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  APP: VREC
  RELEASE_TRACK: shizuku
  BUILD_COMMIT: ${{ github.sha }}

jobs:
  stable-approval:
    permissions:
      contents: read
      pull-requests: read
    uses: N2K02/n2k02updater/.github/workflows/require-stable-merge.yml@cfbb69f4ac19cf6b24aea96f82cadf2144c29635
  build:
    needs: stable-approval
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Test public version resolution
        run: bash .github/scripts/test-public-version.sh

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest release tag of the form vMAJOR.MINOR (v1.9, v2.0, ...).
          # Preserve the highest installed release lineage from source or public distribution.
          local_last=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+[.][0-9]$' | sort -V | tail -1 || true)
          # Query *all* matching public tag refs; the first 100 shared releases are not enough.
          # A lookup error aborts the build instead of silently reusing an older version.
          public_last=$(bash .github/scripts/latest-public-version.sh vrec)
          track_last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | sed -nE 's/^shizuku-v([0-9]+[.][0-9])$/v\1/p' | sort -V | tail -1 || true)
          last=$(printf '%s\n%s\n%s\n' "$local_last" "$public_last" "$track_last" | sort -V | tail -1)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}
            n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          # An explicit workflow_dispatch version must also advance the public channel.
          if [ -n "$last" ]; then
            max=$(printf '%s\n%s\n' "$last" "v$ver" | sort -V | tail -1)
            if [ "$max" != "v$ver" ] || [ "$last" = "v$ver" ]; then
              echo "::error::Requested v$ver must be newer than latest published $last"
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Release v$ver already exists; choose the next version."
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          VERSION_CODE=$(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "VERSION_SUFFIX=-experimental.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "APK_NAME=VREC-SHIZUKU-$ver-experimental.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
            echo "APK_NAME=VREC-SHIZUKU-$ver" >> "$GITHUB_ENV"
          fi
          echo "Version: $ver (previous: ${last:-none})"

          # Build notes from commits since the previous release.
          prev=""
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then prev="$last"; fi
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' "$range" | head -40)
          [ -n "$changes" ] || changes="- Maintenance and build updates"

          {
            echo "## $APP $ver"
            echo "Version code: $VERSION_CODE"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the APK below and install it on your phone."
            echo
            echo "_Built from ${BUILD_COMMIT::7} ${prev:+· changes since $prev}_"
          } > release-notes.md
          cat release-notes.md


      - name: Resolve standardized experimental release name
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/experimental_naming.py --self-test
          GITHUB_ENV="$RUNNER_TEMP/architecture-naming.env" python3 .github/scripts/experimental_naming.py "$GITHUB_REPOSITORY" "$APP" "$GITHUB_RUN_NUMBER" "$PR_NUMBER"
          grep -v '^APK_NAME=' "$RUNNER_TEMP/architecture-naming.env" >> "$GITHUB_ENV"
          base=$(sed -n 's/^VERSION=//p' "$RUNNER_TEMP/architecture-naming.env")
          suffix=$(sed -n 's/^VERSION_SUFFIX=//p' "$RUNNER_TEMP/architecture-naming.env")
          echo "APK_NAME=VREC-SHIZUKU-$base$suffix" >> "$GITHUB_ENV"
      - name: Validate architecture-qualified APK filename
        shell: bash
        run: |
          set -euo pipefail
          expected="$APP-${RELEASE_TRACK^^}-$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            [[ "$VERSION_SUFFIX" =~ ^-experimental[.][0-9]+$ ]] || { echo "::error::Invalid experimental suffix"; exit 1; }
            expected="$expected$VERSION_SUFFIX"
          else
            [[ -z "$VERSION_SUFFIX" ]] || { echo "::error::Stable APK has an experimental suffix"; exit 1; }
          fi
          [[ "$APK_NAME" == "$expected" ]] || { echo "::error::Wrong APK name: $APK_NAME (expected $expected)"; exit 1; }
      - name: Restore encrypted signing keystore
        env:
          SIGNING_KEYSTORE_ENC_BASE64: ${{ secrets.SIGNING_KEYSTORE_ENC_BASE64 }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s signing/keys.tar.enc ]; then
            : "${SIGNING_PASSPHRASE:?SIGNING_PASSPHRASE is required to decrypt signing/keys.tar.enc}"
            umask 077
            mkdir -p "$RUNNER_TEMP/signing"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -pass env:SIGNING_PASSPHRASE -in signing/keys.tar.enc |
              tar -xf - -C "$RUNNER_TEMP/signing"
            test -s "$RUNNER_TEMP/signing/old.keystore"
            if [ -f app/debug.keystore ]; then
              cmp -s app/debug.keystore "$RUNNER_TEMP/signing/old.keystore" ||
                { echo "::error::Signing bundle differs from current certificate"; exit 1; }
            fi
            cp "$RUNNER_TEMP/signing/old.keystore" app/debug.keystore
            echo "Using the verified encrypted signing bundle"
          elif [ -n "$SIGNING_KEYSTORE_ENC_BASE64" ]; then
            if [ -z "$SIGNING_PASSPHRASE" ]; then
              echo "::error::SIGNING_PASSPHRASE must be provided when encrypted keystore is configured"
              exit 1
            fi
            # Encryption: openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt.
            # Decrypt to the same path used by the established release signing config.
            umask 077
            printf '%s' "$SIGNING_KEYSTORE_ENC_BASE64" | base64 --decode |
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                -pass env:SIGNING_PASSPHRASE -out "$RUNNER_TEMP/restored-signing.keystore"
            test -s "$RUNNER_TEMP/restored-signing.keystore"
            # Until the plaintext repository key is removed, require byte-for-byte
            # equality so a different certificate cannot disrupt installed updates.
            if [ -f app/debug.keystore ]; then
              cmp -s app/debug.keystore "$RUNNER_TEMP/restored-signing.keystore" ||
                { echo "::error::Encrypted keystore does not match existing signing identity"; exit 1; }
            fi
            cp "$RUNNER_TEMP/restored-signing.keystore" app/debug.keystore
            echo "Encrypted signing material restored and validated"
          else
            # Temporary backwards-compatible path until migration secrets are configured.
            test -s app/debug.keystore || { echo "::error::Signing keystore missing"; exit 1; }
            echo "::warning::Legacy repository keystore in use. Configure SIGNING_KEYSTORE_ENC_BASE64 and SIGNING_PASSPHRASE to complete encrypted signing migration."
          fi

      - name: Test and build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set -o pipefail
          # Experimental APKs must exercise the same R8-minified variant as
          # production. Debug-only PR builds missed WorkDatabase_Impl startup
          # crashes caused by release shrinking.
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          cp "app/build/outputs/apk/release/app-release.apk" "${APK_NAME:-$APP-$VERSION}.apk"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "${APK_NAME:-$APP-$VERSION}.apk"

      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: shizuku-v${{ env.VERSION }}
          target_commitish: ${{ env.BUILD_COMMIT }}
          name: ${{ env.APP }} ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APK_NAME }}.apk
          make_latest: false
          overwrite_files: false

      - name: Publish signed experimental APK to source PR release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="experimental-shizuku-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Experimental release $TAG already exists (workflow rerun); updating its APK."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "${APK_NAME:-$APP-$VERSION}.apk"
          else
            gh release create "$TAG" "${APK_NAME:-$APP-$VERSION}.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$PR_HEAD_SHA" \
              --title "$EXPERIMENTAL_TITLE" \
              --notes-file release-notes.md --prerelease --latest=false
          fi

  download-index:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write
    uses: N2K02/n2k02updater/.github/workflows/index-downloads.yml@ae58c3ce0196b1b30d214927dd529ce5d779febf
